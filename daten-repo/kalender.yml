# GitHub Action für das PRIVATE Repo gcad-kapazitaet-daten.
# Ablage dort: .github/workflows/kalender.yml
# Secret dort: KALENDER_QUELLEN (siehe app/daten-repo/kalender-holen.mjs)
#
# Läuft Mo–Sa von 6 bis 21 Uhr (deutsche Zeit) alle 15 Minuten. Ein privates Repo hat im kostenlosen
# GitHub-Plan 2.000 Action-Minuten im Monat – rund um die Uhr alle 15 Minuten wären etwa 2.900.

name: Kalender holen

on:
  schedule:
    - cron: '*/15 4-19 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Der Code läuft mit dem Secret: nur der geprüfte Stand, nie automatisch der neueste. Neuer Stand nur nach Joachims Freigabe.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GersterCAD/gcad-kapazitaet
          ref: d6fc372ac0cf683eb666e0078be514adb8d6dbeb
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Kalender holen
        run: node app/daten-repo/kalender-holen.mjs kalender.json
        env:
          KALENDER_QUELLEN: ${{ secrets.KALENDER_QUELLEN }}
      - name: Speichern, wenn geändert
        run: |
          if [ -n "$(git status --porcelain kalender.json)" ]; then
            git config user.name "Kalender"
            git config user.email "actions@users.noreply.github.com"
            git add kalender.json
            git commit -m "Kalender abgeglichen"
            git pull --rebase --autostash
            git push
          fi
